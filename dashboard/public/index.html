<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agency Outreach Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#102f2f',
            accent: { DEFAULT: '#057a72', dark: '#075752', soft: '#ccebe5' },
            mist: '#edf8f5',
            sky: '#d8f2f4',
            muted: '#5f7976',
            line: 'rgba(16, 47, 47, 0.12)',
          },
          fontFamily: {
            sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            card: '0 1px 2px rgba(16, 47, 47, 0.04), 0 8px 24px rgba(16, 47, 47, 0.06)',
            lift: '0 4px 16px rgba(16, 47, 47, 0.1)',
          },
        },
      },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    :root {
      --ink: #102f2f;
      --accent: #057a72;
      --accent-dark: #075752;
      --accent-soft: #ccebe5;
      --mist: #edf8f5;
      --sky: #d8f2f4;
      --muted: #5f7976;
      --surface: #ffffff;
      --line: rgba(16, 47, 47, 0.12);
    }
    [x-cloak] { display: none !important; }
    body {
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(5, 122, 114, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 0%, rgba(216, 242, 244, 0.7), transparent 50%),
        linear-gradient(180deg, #f4fbf9 0%, #edf8f5 40%, #e8f4f1 100%);
      color: var(--ink);
      min-height: 100vh;
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    pre.raw-json { white-space: pre-wrap; word-break: break-word; }
    .surface {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      box-shadow: 0 1px 2px rgba(16, 47, 47, 0.04), 0 8px 24px rgba(16, 47, 47, 0.06);
    }
    .field {
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: #fff;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      color: var(--ink);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field:focus {
      outline: none;
      border-color: rgba(5, 122, 114, 0.55);
      box-shadow: 0 0 0 3px rgba(5, 122, 114, 0.15);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-radius: 0.5rem;
      padding: 0.5rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 0.5rem;
      padding: 0.5rem 0.875rem;
      font-size: 0.875rem;
      color: var(--ink);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-ghost:hover { background: var(--mist); border-color: rgba(5, 122, 114, 0.25); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.45rem;
      border-radius: 0.35rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.2;
      white-space: nowrap;
    }
    .badge-priority { background: #dff5ef; color: #075752; }
    .badge-review { background: #e8f0ff; color: #2a4a8a; }
    .badge-low { background: #f0f2f2; color: #5f7976; }
    .badge-drafted { background: #dff5ef; color: #075752; }
    .badge-sent { background: #d8f2f4; color: #0a5c66; }
    .badge-ready { background: #e8f0ff; color: #2a4a8a; }
    .badge-pending_rating { background: #fff3d6; color: #8a6500; }
    .badge-pending_review { background: #fff3d6; color: #8a6500; }
    .badge-approved { background: #dff5ef; color: #075752; }
    .badge-rejected { background: #fde8e8; color: #9b2c2c; }
    .badge-needs_rewrite { background: #ffe8d6; color: #9a4a12; }
    .badge-failed { background: #fde8e8; color: #9b2c2c; }
    .badge-none { background: #f0f2f2; color: #5f7976; }
    .kpi {
      text-align: left;
      padding: 1rem 1.1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 2px rgba(16, 47, 47, 0.04);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
    }
    .kpi:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(16, 47, 47, 0.1);
      border-color: rgba(5, 122, 114, 0.35);
    }
    .kpi.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(5, 122, 114, 0.18), 0 4px 16px rgba(16, 47, 47, 0.08);
      background: #fff;
    }
    .kpi-label {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .kpi-value {
      margin-top: 0.35rem;
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.1;
    }
    .kpi-hint {
      margin-top: 0.25rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeUp 0.4s ease both;
    }
    .animate-fade-up-delay-1 { animation-delay: 0.05s; }
    .animate-fade-up-delay-2 { animation-delay: 0.1s; }
    .animate-fade-up-delay-3 { animation-delay: 0.15s; }
    .table-wrap thead th {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: rgba(237, 248, 245, 0.85);
    }
    .table-wrap tbody tr {
      transition: background 0.12s ease;
    }
    .table-wrap tbody tr:hover {
      background: rgba(237, 248, 245, 0.55);
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    .nav-tab {
      padding: 0.4rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-tab:hover { background: rgba(5, 122, 114, 0.08); color: var(--ink); }
    .nav-tab.active {
      background: #fff;
      color: var(--accent-dark);
      box-shadow: 0 1px 2px rgba(16, 47, 47, 0.06);
      border: 1px solid var(--line);
    }
    .inbox-shell {
      display: grid;
      grid-template-columns: 11rem minmax(16rem, 22rem) 1fr;
      height: calc(100vh - 8.5rem);
      min-height: 28rem;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      .inbox-shell {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 0;
      }
      .inbox-shell.mobile-reading .inbox-folders,
      .inbox-shell.mobile-reading .inbox-list { display: none; }
      .inbox-shell:not(.mobile-reading) .inbox-pane { display: none; }
    }
    .inbox-folder {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.7rem;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--ink);
      transition: background 0.12s ease;
    }
    .inbox-folder:hover { background: rgba(5, 122, 114, 0.08); }
    .inbox-folder.active {
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 600;
    }
    .inbox-folder-count {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      background: rgba(16, 47, 47, 0.06);
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      min-width: 1.4rem;
      text-align: center;
    }
    .inbox-folder.active .inbox-folder-count {
      background: rgba(5, 122, 114, 0.2);
      color: var(--accent-dark);
    }
    .inbox-row {
      width: 100%;
      text-align: left;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--line);
      transition: background 0.12s ease;
      cursor: pointer;
    }
    .inbox-row:hover { background: rgba(237, 248, 245, 0.7); }
    .inbox-row.selected {
      background: rgba(5, 122, 114, 0.1);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .inbox-row-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.15rem;
    }
    .inbox-compose {
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      overflow: hidden;
      background: #fff;
    }
    .inbox-compose input,
    .inbox-compose textarea {
      width: 100%;
      border: 0;
      resize: vertical;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--ink);
      background: transparent;
    }
    .inbox-compose input {
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    .inbox-compose textarea {
      min-height: 18rem;
      line-height: 1.55;
      font-family: inherit;
    }
    .inbox-compose input:focus,
    .inbox-compose textarea:focus {
      outline: none;
      background: rgba(237, 248, 245, 0.45);
    }
  </style>
</head>
<body>
  <div
    x-data="dashboard()"
    x-init="init()"
    x-cloak
    class="mx-auto px-4 py-6 sm:px-6"
    :class="view === 'inbox' ? 'max-w-[1600px]' : 'max-w-[1400px]'"
    @keydown.window="onInboxKey($event)"
  >
    <header class="mb-5 flex flex-wrap items-end justify-between gap-3 animate-fade-up">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.08em] text-accent mb-1">Grand River Labs</p>
        <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-ink">Agency Outreach</h1>
        <p class="text-sm text-muted mt-1" x-show="view !== 'inbox'">
          Review fit scores, approve or reject outreach drafts, and track pipeline health.
        </p>
        <p class="text-sm text-muted mt-1" x-show="view === 'inbox'">
          Review drafted emails — edit, approve, or reject. Use j/k to move, a to approve.
        </p>
        <nav x-show="token" class="mt-3 flex items-center gap-1 p-1 rounded-xl bg-white/60 border border-[var(--line)] w-fit">
          <button
            type="button"
            class="nav-tab"
            :class="{ active: view === 'list' || view === 'detail' }"
            @click="openAgencies()"
          >Agencies</button>
          <button
            type="button"
            class="nav-tab"
            :class="{ active: view === 'inbox' }"
            @click="openInbox()"
          >
            Inbox
            <span
              x-show="overview && overview.pending_review > 0"
              class="ml-1 inline-flex items-center justify-center min-w-[1.15rem] h-[1.15rem] px-1 rounded-full text-[0.65rem] font-semibold bg-amber-100 text-amber-800"
              x-text="overview.pending_review"
            ></span>
          </button>
        </nav>
      </div>
      <div class="flex items-center gap-2">
        <span
          class="badge"
          :class="token ? 'badge-drafted' : 'badge-pending_rating'"
          x-text="token ? 'Authenticated' : 'Needs token'"
        ></span>
        <span class="text-sm text-muted" x-text="statusText"></span>
      </div>
    </header>

    <template x-if="!token">
      <div class="surface p-5 mb-6 border-l-4 border-l-amber-400 animate-fade-up">
        <p class="text-sm font-medium text-ink mb-1">Access token required</p>
        <p class="text-sm text-muted mb-3">Open this page with <code class="text-accent">?token=…</code> or paste the token below.</p>
        <form @submit.prevent="saveToken()" class="flex gap-2 max-w-lg">
          <input
            type="password"
            x-model="tokenInput"
            placeholder="Access token"
            class="field flex-1"
          />
          <button type="submit" class="btn-primary">Continue</button>
        </form>
      </div>
    </template>

    <template x-if="token && view === 'list'">
      <div>
        <!-- Overview board -->
        <div class="mb-5 animate-fade-up animate-fade-up-delay-1">
          <div class="flex items-center justify-between gap-3 mb-3">
            <h2 class="section-title">Overview</h2>
            <p class="text-xs text-muted" x-show="overview">Click a card to filter the list</p>
          </div>
          <div x-show="overviewLoading" class="text-sm text-muted mb-3">Loading overview…</div>
          <template x-if="overview">
            <div class="space-y-4">
              <div>
                <p class="kpi-label mb-2">Fit pipeline</p>
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'total' }" @click="applyOverviewFilter('total')">
                    <div class="kpi-label">Total scored</div>
                    <div class="kpi-value" x-text="overview.total_scored"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'priority' }" @click="applyOverviewFilter('priority')">
                    <div class="kpi-label">Priority</div>
                    <div class="kpi-value" x-text="overview.tier_priority"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'review' }" @click="applyOverviewFilter('review')">
                    <div class="kpi-label">Review</div>
                    <div class="kpi-value" x-text="overview.tier_review"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'low' }" @click="applyOverviewFilter('low')">
                    <div class="kpi-label">Low</div>
                    <div class="kpi-value" x-text="overview.tier_low"></div>
                  </button>
                  <div class="kpi" style="cursor: default" @click.prevent>
                    <div class="kpi-label">Avg fit</div>
                    <div class="kpi-value" x-text="fmtAvg(overview.avg_fit_score)"></div>
                  </div>
                  <div class="kpi" style="cursor: default" @click.prevent>
                    <div class="kpi-label">Avg WL</div>
                    <div class="kpi-value" x-text="fmtAvg(overview.avg_white_label_score)"></div>
                  </div>
                </div>
              </div>
              <div>
                <p class="kpi-label mb-2">Outreach funnel</p>
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'pending_review' }" @click="applyOverviewFilter('pending_review')">
                    <div class="kpi-label">Pending review</div>
                    <div class="kpi-value" x-text="overview.pending_review"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'approved' }" @click="applyOverviewFilter('approved')">
                    <div class="kpi-label">Approved</div>
                    <div class="kpi-value" x-text="overview.approved"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'rejected' }" @click="applyOverviewFilter('rejected')">
                    <div class="kpi-label">Rejected</div>
                    <div class="kpi-value" x-text="overview.rejected"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'never' }" @click="applyOverviewFilter('never')">
                    <div class="kpi-label">Never contacted</div>
                    <div class="kpi-value" x-text="overview.never_contacted"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'drafted' }" @click="applyOverviewFilter('drafted')">
                    <div class="kpi-label">Drafted</div>
                    <div class="kpi-value" x-text="overview.drafted"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'failed' }" @click="applyOverviewFilter('failed')">
                    <div class="kpi-label">Failed</div>
                    <div class="kpi-value" x-text="overview.failed"></div>
                  </button>
                </div>
              </div>
              <div>
                <p class="kpi-label mb-2">Activity & quality</p>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'drafted_7d' }" @click="applyOverviewFilter('drafted_7d')">
                    <div class="kpi-label">Drafted (7 days)</div>
                    <div class="kpi-value" x-text="overview.drafted_last_7_days"></div>
                  </button>
                  <button type="button" class="kpi" :class="{ active: activeKpi === 'eligible' }" @click="applyOverviewFilter('eligible')">
                    <div class="kpi-label">Eligible awaiting</div>
                    <div class="kpi-value" x-text="overview.eligible_awaiting"></div>
                    <div class="kpi-hint">WL fit · score ≥ 70 · email</div>
                  </button>
                  <div class="kpi" style="cursor: default" @click.prevent>
                    <div class="kpi-label">Avg draft score</div>
                    <div class="kpi-value" x-text="fmtAvg(overview.avg_overall_score)"></div>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <div class="surface p-4 mb-4 space-y-3 animate-fade-up animate-fade-up-delay-2">
          <div class="flex flex-wrap gap-2.5">
            <input
              type="search"
              x-model="search"
              placeholder="Search name, domain, city…"
              class="field min-w-[220px] flex-1"
            />
            <select x-model="filters.tier" class="field">
              <option value="">All tiers</option>
              <option value="priority">priority</option>
              <option value="review">review</option>
              <option value="low">low</option>
            </select>
            <select x-model="filters.outreachStatus" class="field">
              <option value="">Outreach: any</option>
              <option value="never">Never contacted</option>
              <option value="pending_review">pending_review</option>
              <option value="approved">approved</option>
              <option value="rejected">rejected</option>
              <option value="drafted">drafted</option>
              <option value="sent">sent</option>
              <option value="failed">failed</option>
              <option value="needs_rewrite">needs_rewrite</option>
              <option value="ready">ready</option>
              <option value="pending_rating">pending_rating</option>
            </select>
            <input
              type="number"
              x-model.number="filters.minFit"
              placeholder="Min fit"
              min="0"
              max="100"
              class="field w-24"
            />
            <input
              type="number"
              x-model.number="filters.maxFit"
              placeholder="Max fit"
              min="0"
              max="100"
              class="field w-24"
            />
            <select x-model="filters.whiteLabelFit" class="field">
              <option value="">WL fit: any</option>
              <option value="true">WL fit: yes</option>
              <option value="false">WL fit: no</option>
            </select>
            <select x-model="filters.opsFit" class="field">
              <option value="">Ops fit: any</option>
              <option value="true">Ops fit: yes</option>
              <option value="false">Ops fit: no</option>
            </select>
            <select x-model="filters.isRealAgency" class="field">
              <option value="">Real agency: any</option>
              <option value="true">Real agency: yes</option>
              <option value="false">Real agency: no</option>
            </select>
            <select x-model="filters.agencyType" class="field">
              <option value="">All types</option>
              <template x-for="t in agencyTypes" :key="t">
                <option :value="t" x-text="t"></option>
              </template>
            </select>
            <select x-model="filters.estimatedSize" class="field">
              <option value="">All sizes</option>
              <template x-for="s in estimatedSizes" :key="s">
                <option :value="s" x-text="s"></option>
              </template>
            </select>
            <select x-model="filters.eligibleOnly" class="field">
              <option value="">Eligibility: any</option>
              <option value="true">Eligible awaiting</option>
            </select>
            <button type="button" @click="resetFilters()" class="btn-ghost">Reset</button>
            <button type="button" @click="refreshAll()" class="btn-primary" :disabled="loading">
              <span x-text="loading ? 'Loading…' : 'Refresh'"></span>
            </button>
          </div>
          <p class="text-xs text-muted">
            Showing <span class="font-medium text-ink" x-text="filtered.length"></span> of
            <span class="font-medium text-ink" x-text="agencies.length"></span> agencies
          </p>
        </div>

        <div x-show="error" class="bg-red-50 border border-red-200 text-red-800 rounded-xl p-3 mb-4 text-sm" x-text="error"></div>

        <div class="surface overflow-hidden animate-fade-up animate-fade-up-delay-3 table-wrap">
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="border-b border-[var(--line)] text-left">
                <tr>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('agency_name')">Name</th>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('city')">City</th>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('contact_name')">Contact</th>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('tier')">Tier</th>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('outreach_status')">Outreach</th>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('fit_score')">Fit</th>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('white_label_score')">WL</th>
                  <th class="px-3 py-2.5 cursor-pointer" @click="setSort('ops_automation_score')">Ops</th>

                    <span x-show="!detail.source_url">—</span>
                  </dd>

            <section class="surface p-4">

                <div><dt class="text-muted text-xs mb-0.5">Drafted at</dt><dd class="font-medium" x-text="formatDate(detail.drafted_at)"></dd></div>
                <div><dt class="text-muted text-xs mb-0.5">Outreach updated</dt><dd class="font-medium" x-text="formatDate(detail.outreach_updated_at)"></dd></div>
              </dl>

              <div class="mt-4 space-y-2">
                <div>
                  <p class="text-muted text-xs mb-1">Subject</p>
                  <p class="text-sm font-medium text-ink" x-text="detail.outreach_subject || '—'"></p>
                </div>
                <div>
                  <p class="text-muted text-xs mb-1">Body</p>
                  <pre
                    class="text-sm whitespace-pre-wrap break-words bg-mist/60 border border-[var(--line)] rounded-lg p-3 max-h-[28rem] overflow-auto"
                    x-text="detail.outreach_body || '—'"
                  ></pre>
                </div>
              </div>

              <div x-show="detail.outreach_error" class="mt-3 text-sm bg-red-50 border border-red-200 text-red-800 rounded-lg p-3">

                <label class="block text-sm">
                  <span class="text-muted text-xs">Reject reason (optional)</span>

                <div class="flex flex-wrap gap-2">
                  <button
                    type="button"
                    class="btn-primary"
                    :disabled="reviewing"
                    @click="reviewOutreach('approve')"

                    <span x-text="reviewing === 'approve' ? 'Approving…' : 'Approve'"></span>
                  </button>
                  <button
                    type="button"
                    class="btn-ghost text-red-700 border-red-200 hover:bg-red-50"
                    :disabled="reviewing"

                    <input type="checkbox" class="accent-accent" x-model="drafts[detail.agency_id].ops_fit" />

                  </label>
                </div>
                <dl class="space-y-2">
                  <div><dt class="text-muted text-xs mb-0.5">Agency type</dt><dd class="font-medium" x-text="detail.agency_type || '—'"></dd></div>
                  <div><dt class="text-muted text-xs mb-0.5">Estimated size</dt><dd class="font-medium" x-text="detail.estimated_size || '—'"></dd></div>

                  class="field mt-1 w-full"
                ></textarea>

              <h3 class="section-title mb-3">Analysis</h3>

        <aside class="inbox-folders border-r border-[var(--line)] p-2 sm:p-3 bg-mist/40 overflow-y-auto">
          <p class="px-2 mb-2 text-[0.65rem] font-semibold uppercase tracking-[0.06em] text-muted">Folders</p>

            <template x-for="folder in inboxFolders" :key="folder.id">

                class="inbox-folder shrink-0"
                :class="{ active: inboxFolder === folder.id }"

              >
                <span x-text="folder.label"></span>
                <span class="inbox-folder-count" x-text="folderCount(folder.id)"></span>
              </button>
            </template>
          </div>
          <p class="hidden sm:block mt-4 px-2 text-[0.65rem] text-muted leading-relaxed">

              placeholder="Search agency, contact, subject…"

            />

            <div x-show="loading" class="p-4 text-sm text-muted">Loading drafts…</div>

              <p class="text-xs text-muted mt-1" x-text="inboxEmptyHint"></p>
            </div>

              <button
                type="button"
                class="inbox-row block"
                :class="{ selected: inboxSelectedId === row.agency_id }"

                <div class="inbox-row-meta">
                  <span class="text-sm font-semibold text-ink truncate" x-text="row.contact_name || row.agency_name || 'Unknown'"></span>

                    class="badge"
                    :class="outreachBadgeClass(row.outreach_status)"

                  <span
                    x-show="row.overall_score != null"
                    class="text-[0.65rem] text-muted"
                    x-text="'Score ' + row.overall_score"
                  ></span>
                </div>
              </button>
            </template>
          </div>

        <!-- Reading pane -->
        <section class="inbox-pane flex flex-col min-h-0 min-w-0 bg-white">
          <div x-show="!inboxSelectedId" class="flex-1 flex items-center justify-center p-8 text-center">
            <div>
              <p class="text-sm font-medium text-ink">Select an email to review</p>
              <p class="text-xs text-muted mt-1">Pick a draft from the list — oldest pending first.</p>
            </div>
          </div>

          <div x-show="inboxSelectedId && inboxLoading" class="flex-1 flex items-center justify-center p-8 text-sm text-muted">
            Loading email…
          </div>

          <template x-if="inboxSelectedId && !inboxLoading && inboxDraft">
            <div class="flex flex-col h-full min-h-0">
              <div class="shrink-0 p-4 border-b border-[var(--line)] space-y-3">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <button
                      type="button"
                      class="sm:hidden text-xs text-accent font-medium mb-2"
                      @click="inboxMobileReading = false; inboxSelectedId = null; inboxDraft = null; syncInboxHash()"
                    >← Back to list</button>
                    <h2 class="text-lg font-semibold text-ink leading-snug" x-text="inboxDraft.outreach_subject || '(no subject)'"></h2>
                    <p class="text-sm text-muted mt-0.5">
                      <span x-text="inboxDraft.agency_name"></span>
                      <span x-show="inboxDraft.website"> · </span>
                      <a
                        x-show="inboxDraft.website"
                        :href="inboxDraft.website"
                        target="_blank"
                        rel="noopener"
                        class="text-accent hover:underline"
                        x-text="inboxDraft.domain || 'website'"
                      ></a>
                    </p>
                  </div>
                  <div class="flex flex-wrap items-center gap-1.5 shrink-0">
                    <span
                      class="badge"
                      :class="outreachBadgeClass(inboxDraft.outreach_status)"
                      x-text="inboxDraft.outreach_status || '—'"
                    ></span>
                    <span
                      x-show="inboxDraft.overall_score != null"
                      class="badge badge-none"
                      x-text="'Overall ' + inboxDraft.overall_score"
                    ></span>
                  </div>
                </div>

                <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-sm">
                  <div class="flex gap-2 min-w-0">
                    <dt class="text-muted shrink-0">To</dt>
                    <dd class="font-medium truncate" x-text="formatInboxTo(inboxDraft)"></dd>
                  </div>
                  <div class="flex gap-2 min-w-0">
                    <dt class="text-muted shrink-0">Drafted</dt>
                    <dd class="font-medium" x-text="formatDate(inboxDraft.drafted_at)"></dd>
                  </div>
                  <div class="flex gap-2" x-show="inboxDraft.accuracy_score != null || inboxDraft.quality_score != null">
                    <dt class="text-muted shrink-0">A / Q</dt>
                    <dd class="font-medium">
                      <span x-text="inboxDraft.accuracy_score ?? '—'"></span>
                      /
                      <span x-text="inboxDraft.quality_score ?? '—'"></span>
                    </dd>
                  </div>
                  <div class="flex gap-2">
                    <dt class="text-muted shrink-0">Agency</dt>
                    <dd>
                      <button type="button" class="text-accent hover:underline font-medium" @click="openDetail(inboxDraft.agency_id)">
                        View profile
                      </button>
                    </dd>
                  </div>
                </dl>

                <div
                  x-show="inboxDraft.outreach_error && inboxDraft.outreach_status !== 'pending_review'"
                  class="text-sm bg-red-50 border border-red-200 text-red-800 rounded-lg p-3"
                >
                  <span class="font-medium">Note:</span>
                  <span x-text="inboxDraft.outreach_error"></span>
                </div>
              </div>

              <div class="flex-1 overflow-y-auto p-4 space-y-3 min-h-0">
                <template x-if="inboxDraft.outreach_status === 'pending_review'">
                  <div class="space-y-2">
                    <div class="flex items-center justify-between gap-2">
                      <p class="text-xs font-medium text-muted uppercase tracking-[0.04em]">Draft</p>
                      <span x-show="inboxEditDirty" class="text-xs font-medium text-amber-700">Unsaved edits</span>
                    </div>
                    <div class="inbox-compose">
                      <input type="text" x-model="inboxEdit.subject" placeholder="Subject" />
                      <textarea x-model="inboxEdit.body" placeholder="Email body" rows="16"></textarea>
                    </div>
                  </div>
                </template>
                <template x-if="inboxDraft.outreach_status !== 'pending_review'">
                  <div class="space-y-3">
                    <div>
                      <p class="text-xs text-muted mb-1">Subject</p>
                      <p class="text-sm font-semibold text-ink" x-text="inboxDraft.outreach_subject || '—'"></p>
                    </div>
                    <div>
                      <p class="text-xs text-muted mb-1">Body</p>
                      <pre
                        class="text-sm whitespace-pre-wrap break-words bg-mist/60 border border-[var(--line)] rounded-lg p-4"
                        x-text="inboxDraft.outreach_body || '—'"
                      ></pre>
                    </div>
                  </div>
                </template>
              </div>

              <div
                x-show="inboxDraft.outreach_status === 'pending_review'"
                class="shrink-0 p-4 border-t border-[var(--line)] bg-mist/30 space-y-3"
              >
                <label class="block text-sm">
                  <span class="text-muted text-xs">Reject reason (optional)</span>
                  <input
                    type="text"
                    class="field mt-1 w-full"
                    x-model="inboxReviewNote"
                    x-ref="inboxRejectNote"
                    placeholder="Why reject this draft?"
                    @keydown.enter.prevent="reviewInboxDraft('reject')"
                  />
                </label>
                <div class="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    class="btn-primary"
                    :disabled="reviewing"
                    @click="reviewInboxDraft('approve')"
                  >
                    <span x-text="reviewing === 'approve' ? 'Approving…' : (inboxEditDirty ? 'Save & approve' : 'Approve')"></span>
                  </button>
                  <button
                    type="button"
                    class="btn-ghost text-red-700 border-red-200 hover:bg-red-50"
                    :disabled="reviewing"
                    @click="reviewInboxDraft('reject')"
                  >
                    <span x-text="reviewing === 'reject' ? 'Rejecting…' : 'Reject (re-queue)'"></span>
                  </button>
                  <button
                    type="button"
                    class="btn-ghost"
                    :disabled="!inboxHasNext"
                    @click="selectNextInboxDraft()"
                  >Next</button>
                  <span class="text-xs text-muted ml-auto hidden sm:inline">j/k navigate · a approve · r reject note</span>
                </div>
              </div>
            </div>
          </template>
        </section>
      </div>
      </div>
    </template>
  </div>

  <script>
    function dashboard() {
      return {
        token: '',
        tokenInput: '',
        agencies: [],
        drafts: {},
        overview: null,
        overviewLoading: false,
        loading: false,
        savingId: null,
        savedId: null,
        error: '',
        search: '',
        sortKey: 'fit_score',
        sortDir: 'desc',
        view: 'list',
        selectedId: null,
        detail: null,
        detailLoading: false,
        showRaw: false,
        activeKpi: '',
        reviewNote: '',
        reviewing: null,
        inboxFolder: 'pending_review',
        inboxSelectedId: null,
        inboxDraft: null,
        inboxLoading: false,
        inboxSearch: '',
        inboxReviewNote: '',
        inboxEdit: { subject: '', body: '' },
        inboxMobileReading: false,
        inboxFolders: [
          { id: 'pending_review', label: 'Pending' },
          { id: 'approved', label: 'Approved' },
          { id: 'rejected', label: 'Rejected' },
          { id: 'failed', label: 'Failed' },
        ],
        filters: {
          tier: '',
          outreachStatus: '',
          eligibleOnly: '',
          draftedWithinDays: null,
          minFit: null,
          maxFit: null,
          whiteLabelFit: '',
          opsFit: '',
          isRealAgency: '',
          agencyType: '',
          estimatedSize: '',
        },

        get statusText() {
          if (!this.token) return 'Not authenticated';
          if (this.inboxLoading) return 'Loading email…';
          if (this.detailLoading) return 'Loading detail…';
          if (this.loading) return 'Loading…';
          if (this.view === 'inbox') {
            const n = this.folderCount('pending_review');
            return n + ' pending review';
          }
          if (this.view === 'detail' && this.detail) return this.detail.agency_name;
          return this.agencies.length + ' loaded';
        },

        get agencyTypes() {
          return [...new Set(this.agencies.map((a) => a.agency_type).filter(Boolean))].sort();
        },

        get estimatedSizes() {
          return [...new Set(this.agencies.map((a) => a.estimated_size).filter(Boolean))].sort();
        },

        get inboxFolderLabel() {
          const f = this.inboxFolders.find((x) => x.id === this.inboxFolder);
          return f ? f.label : 'Inbox';
        },

        get inboxEmptyTitle() {
          if (this.inboxFolder === 'pending_review') return "You're caught up";
          if (this.inboxFolder === 'approved') return 'No approved emails yet';
          if (this.inboxFolder === 'rejected') return 'No rejected drafts';
          if (this.inboxFolder === 'failed') return 'No failed drafts';
          return 'Nothing here';
        },

        get inboxEmptyHint() {
          if (this.inboxFolder === 'pending_review') return 'No drafts pending review. New ones appear after the drafting workflow runs.';
          if (this.inboxFolder === 'failed') return 'Drafting failures will show up here with an error note.';
          return 'Switch folders or check back after the next draft run.';
        },

        get inboxMessages() {
          const q = (this.inboxSearch || '').trim().toLowerCase();
          let rows = this.agencies.filter((a) => a.outreach_status === this.inboxFolder);
          if (q) {
            rows = rows.filter((a) => {
              const hay = [
                a.agency_name,
                a.contact_name,
                a.contact_email,
                a.outreach_subject,
                a.outreach_snippet,
                a.domain,
              ].filter(Boolean).join(' ').toLowerCase();
              return hay.includes(q);
            });
          }
          const asc = this.inboxFolder === 'pending_review';
          return [...rows].sort((a, b) => {
            const at = a.drafted_at ? new Date(a.drafted_at).getTime() : 0;
            const bt = b.drafted_at ? new Date(b.drafted_at).getTime() : 0;
            return asc ? at - bt : bt - at;
          });
        },

        get inboxEditDirty() {
          if (!this.inboxDraft || this.inboxDraft.outreach_status !== 'pending_review') return false;
          return (
            (this.inboxEdit.subject || '') !== (this.inboxDraft.outreach_subject || '') ||
            (this.inboxEdit.body || '') !== (this.inboxDraft.outreach_body || '')
          );
        },

        get inboxHasNext() {
          const list = this.inboxMessages;
          if (!list.length || !this.inboxSelectedId) return false;
          const idx = list.findIndex((a) => a.agency_id === this.inboxSelectedId);
          return idx >= 0 && idx < list.length - 1;
        },

        folderCount(folderId) {
          if (this.overview) {
            const map = {
              pending_review: this.overview.pending_review,
              approved: this.overview.approved,
              rejected: this.overview.rejected,
              failed: this.overview.failed,
            };
            if (map[folderId] != null) return Number(map[folderId]) || 0;
          }
          return this.agencies.filter((a) => a.outreach_status === folderId).length;
        },

        formatInboxTo(row) {
          if (!row) return '—';
          const name = row.contact_name || '';
          const email = row.contact_email || '';
          if (name && email) return name + ' <' + email + '>';
          return email || name || '—';
        },

        formatShortDate(v) {
          if (!v) return '';
          try {
            const d = new Date(v);
            const now = new Date();
            const sameDay = d.toDateString() === now.toDateString();
            if (sameDay) {
              return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            }
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
          } catch (e) {
            return '';
          }
        },

        isEligibleAwaiting(a) {
          const hasEmail = !!(a.contact_email && String(a.contact_email).trim());
          const status = a.outreach_status;
          const blocked = ['drafted', 'sent', 'pending_review', 'approved'].includes(status);
          return (
            !!a.white_label_fit &&
            !!a.is_real_agency &&
            Number(a.white_label_score) >= 70 &&
            hasEmail &&
            !blocked
          );
        },

        matchesOutreachFilter(a, statusFilter) {
          if (!statusFilter) return true;
          const status = a.outreach_status || null;
          if (statusFilter === 'never') return !status;
          if (statusFilter === 'ready_pending') {
            return status === 'ready' || status === 'pending_rating';
          }
          return status === statusFilter;
        },

        get filtered() {
          const q = (this.search || '').trim().toLowerCase();
          let rows = this.agencies.filter((a) => {
            if (q) {
              const hay = [a.agency_name, a.domain, a.city, a.category].filter(Boolean).join(' ').toLowerCase();
              if (!hay.includes(q)) return false;
            }
            if (this.filters.tier && a.tier !== this.filters.tier) return false;
            if (!this.matchesOutreachFilter(a, this.filters.outreachStatus)) return false;
            if (this.filters.eligibleOnly === 'true' && !this.isEligibleAwaiting(a)) return false;
            if (this.filters.draftedWithinDays != null) {
              if (a.outreach_status !== 'drafted' || !a.drafted_at) return false;
              const days = Number(this.filters.draftedWithinDays);
              const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
              if (new Date(a.drafted_at).getTime() < cutoff) return false;
            }
            if (this.filters.minFit != null && this.filters.minFit !== '' && Number(a.fit_score) < Number(this.filters.minFit)) return false;
            if (this.filters.maxFit != null && this.filters.maxFit !== '' && Number(a.fit_score) > Number(this.filters.maxFit)) return false;
            if (this.filters.whiteLabelFit !== '' && String(!!a.white_label_fit) !== this.filters.whiteLabelFit) return false;
            if (this.filters.opsFit !== '' && String(!!a.ops_fit) !== this.filters.opsFit) return false;
            if (this.filters.isRealAgency !== '' && String(!!a.is_real_agency) !== this.filters.isRealAgency) return false;
            if (this.filters.agencyType && a.agency_type !== this.filters.agencyType) return false;
            if (this.filters.estimatedSize && a.estimated_size !== this.filters.estimatedSize) return false;
            return true;
          });

          const key = this.sortKey;
          const dir = this.sortDir === 'asc' ? 1 : -1;
          rows = [...rows].sort((a, b) => {
            const av = a[key];
            const bv = b[key];
            if (av == null && bv == null) return 0;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
            return String(av).localeCompare(String(bv)) * dir;
          });
          return rows;
        },

        init() {
          const params = new URLSearchParams(window.location.search);
          const fromUrl = (params.get('token') || '').trim();
          if (fromUrl) {
            sessionStorage.setItem('agencyFitToken', fromUrl);
            this.token = fromUrl;
          } else {
            this.token = (sessionStorage.getItem('agencyFitToken') || '').trim();
          }

          window.addEventListener('hashchange', () => this.syncHash());

          if (this.token) {
            this.refreshAll().then(() => this.syncHash());
          }
        },

        saveToken() {
          const t = (this.tokenInput || '').trim();
          if (!t) return;
          sessionStorage.setItem('agencyFitToken', t);
          this.token = t;
          this.refreshAll().then(() => this.syncHash());
        },

        parseAgencyHash() {
          const m = (window.location.hash || '').match(/^#\/agency\/(\d+)$/);
          return m ? Number(m[1]) : null;
        },

        parseInboxHash() {
          const hash = window.location.hash || '';
          const withId = hash.match(/^#\/inbox\/(\d+)$/);
          if (withId) return { inbox: true, id: Number(withId[1]) };
          if (hash === '#/inbox' || hash === '#/inbox/') return { inbox: true, id: null };
          return null;
        },

        syncHash() {
          if (!this.token) return;
          const inbox = this.parseInboxHash();
          if (inbox) {
            this.view = 'inbox';
            this.selectedId = null;
            this.detail = null;
            if (inbox.id) {
              if (this.inboxSelectedId !== inbox.id || !this.inboxDraft) {
                this.selectInboxDraft(inbox.id, false);
              }
            } else if (!this.inboxSelectedId && this.inboxFolder === 'pending_review') {
              const first = this.inboxMessages[0];
              if (first) this.selectInboxDraft(first.agency_id, true);
            }
            return;
          }
          const id = this.parseAgencyHash();
          if (id) {
            if (this.view !== 'detail' || this.selectedId !== id) this.openDetail(id, false);
          } else if (this.view === 'detail') {
            this.closeDetail(false);
          } else if (this.view === 'inbox') {
            this.view = 'list';
            this.inboxSelectedId = null;
            this.inboxDraft = null;
            this.inboxMobileReading = false;
          }
        },

        openAgencies() {
          this.view = 'list';
          this.selectedId = null;
          this.detail = null;
          this.inboxSelectedId = null;
          this.inboxDraft = null;
          this.inboxMobileReading = false;
          if (window.location.hash) {
            history.pushState('', document.title, window.location.pathname + window.location.search);
          }
        },

        openInbox(folder = 'pending_review', agencyId = null) {
          this.view = 'inbox';
          this.selectedId = null;
          this.detail = null;
          this.inboxFolder = folder || 'pending_review';
          this.inboxMobileReading = false;
          this.error = '';
          if (agencyId) {
            this.selectInboxDraft(agencyId, true);
          } else {
            this.inboxSelectedId = null;
            this.inboxDraft = null;
            this.syncInboxHash();
            const first = this.inboxMessages[0];
            if (first && this.inboxFolder === 'pending_review') {
              this.selectInboxDraft(first.agency_id, true);
            }
          }
        },

        syncInboxHash() {
          let next = '#/inbox';
          if (this.inboxSelectedId) next = '#/inbox/' + this.inboxSelectedId;
          if (window.location.hash !== next) window.location.hash = next;
        },

        setInboxFolder(folderId) {
          if (this.inboxFolder === folderId) return;
          this.inboxFolder = folderId;
          this.inboxSelectedId = null;
          this.inboxDraft = null;
          this.inboxEdit = { subject: '', body: '' };
          this.inboxReviewNote = '';
          this.inboxMobileReading = false;
          this.syncInboxHash();
          if (folderId === 'pending_review' && this.inboxMessages[0]) {
            this.selectInboxDraft(this.inboxMessages[0].agency_id, true);
          }
        },

        async selectInboxDraft(agencyId, pushHash = true) {
          const id = Number(agencyId);
          if (!Number.isFinite(id) || id <= 0) return;
          this.view = 'inbox';
          this.inboxSelectedId = id;
          this.inboxLoading = true;
          this.inboxMobileReading = true;
          this.error = '';
          this.inboxReviewNote = '';
          this.reviewing = null;
          if (pushHash) this.syncInboxHash();
          try {
            const res = await fetch(this.apiUrl('detail', id), {
              headers: { Authorization: 'Bearer ' + this.token },
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || ('HTTP ' + res.status));
            }
            const row = this.normalizeRow(await res.json());
            this.inboxDraft = row;
            if (row.outreach_status && row.outreach_status !== this.inboxFolder) {
              this.inboxFolder = row.outreach_status;
            }
            this.inboxEdit = {
              subject: row.outreach_subject || '',
              body: row.outreach_body || '',
            };
            const listIdx = this.agencies.findIndex((a) => a.agency_id === id);
            if (listIdx >= 0) {
              this.agencies[listIdx] = {
                ...this.agencies[listIdx],
                outreach_status: row.outreach_status,
                outreach_subject: row.outreach_subject,
                outreach_snippet: row.outreach_body
                  ? String(row.outreach_body).slice(0, 140)
                  : this.agencies[listIdx].outreach_snippet,
                outreach_error: row.outreach_error,
                overall_score: row.overall_score,
                drafted_at: row.drafted_at,
              };
            }
          } catch (e) {
            this.error = e.message || String(e);
            this.inboxDraft = null;
          } finally {
            this.inboxLoading = false;
          }
        },

        selectNextInboxDraft() {
          const list = this.inboxMessages;
          const idx = list.findIndex((a) => a.agency_id === this.inboxSelectedId);
          if (idx >= 0 && idx < list.length - 1) {
            this.selectInboxDraft(list[idx + 1].agency_id);
          }
        },

        selectPrevInboxDraft() {
          const list = this.inboxMessages;
          const idx = list.findIndex((a) => a.agency_id === this.inboxSelectedId);
          if (idx > 0) {
            this.selectInboxDraft(list[idx - 1].agency_id);
          }
        },

        onInboxKey(e) {
          if (this.view !== 'inbox' || this.reviewing) return;
          const tag = (e.target && e.target.tagName) || '';
          const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
          if (typing) return;
          const key = (e.key || '').toLowerCase();
          if (key === 'j') {
            e.preventDefault();
            this.selectNextInboxDraft();
          } else if (key === 'k') {
            e.preventDefault();
            this.selectPrevInboxDraft();
          } else if (key === 'a' && this.inboxFolder === 'pending_review' && this.inboxDraft?.outreach_status === 'pending_review') {
            e.preventDefault();
            this.reviewInboxDraft('approve');
          } else if (key === 'r' && this.inboxFolder === 'pending_review' && this.inboxDraft?.outreach_status === 'pending_review') {
            e.preventDefault();
            this.$nextTick(() => {
              const el = this.$refs.inboxRejectNote;
              if (el) el.focus();
            });
          }
        },

        async reviewInboxDraft(action) {
          if (!this.inboxDraft || this.inboxDraft.outreach_status !== 'pending_review') return;
          if (action === 'approve') {
            if (!(this.inboxEdit.subject || '').trim()) {
              this.error = 'Subject cannot be empty';
              return;
            }
            if (!(this.inboxEdit.body || '').trim()) {
              this.error = 'Body cannot be empty';
              return;
            }
          }

          const list = this.inboxMessages;
          const idx = list.findIndex((a) => a.agency_id === this.inboxDraft.agency_id);
          const nextId = (idx >= 0 && list[idx + 1])
            ? list[idx + 1].agency_id
            : (idx > 0 ? list[idx - 1].agency_id : null);

          this.reviewing = action;
          this.error = '';
          try {
            const payload = {
              agency_id: this.inboxDraft.agency_id,
              action,
              note: this.inboxReviewNote || null,
            };
            if (action === 'approve') {
              payload.subject = this.inboxEdit.subject;
              payload.body = this.inboxEdit.body;
            }
            const res = await fetch(this.apiUrl('review'), {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + this.token,
              },
              body: JSON.stringify(payload),
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || ('HTTP ' + res.status));
            }
            const updated = await res.json();
            const patch = {
              outreach_status: updated.outreach_status,
              outreach_subject: updated.outreach_subject,
              outreach_body: updated.outreach_body,
              outreach_snippet: updated.outreach_snippet
                || (updated.outreach_body ? String(updated.outreach_body).slice(0, 140) : null),
              outreach_error: updated.outreach_error,
              overall_score: updated.overall_score,
              accuracy_score: updated.accuracy_score,
              quality_score: updated.quality_score,
              gmail_draft_id: updated.gmail_draft_id,
              drafted_at: updated.drafted_at,
              outreach_updated_at: updated.outreach_updated_at,
            };
            const listIdx = this.agencies.findIndex((a) => a.agency_id === this.inboxDraft.agency_id);
            if (listIdx >= 0) {
              this.agencies[listIdx] = { ...this.agencies[listIdx], ...patch };
            }
            if (this.detail && this.detail.agency_id === this.inboxDraft.agency_id) {
              this.detail = { ...this.detail, ...patch };
            }
            this.inboxReviewNote = '';
            this.loadOverview();

            if (this.inboxFolder === 'pending_review' && nextId) {
              await this.selectInboxDraft(nextId, true);
            } else {
              this.inboxSelectedId = null;
              this.inboxDraft = null;
              this.inboxMobileReading = false;
              this.syncInboxHash();
            }
          } catch (e) {
            this.error = e.message || String(e);
          } finally {
            this.reviewing = null;
          }
        },

        emptyFilters() {
          return {
            tier: '',
            outreachStatus: '',
            eligibleOnly: '',
            draftedWithinDays: null,
            minFit: null,
            maxFit: null,
            whiteLabelFit: '',
            opsFit: '',
            isRealAgency: '',
            agencyType: '',
            estimatedSize: '',
          };
        },

        resetFilters() {
          this.search = '';
          this.activeKpi = '';
          this.filters = this.emptyFilters();
        },

        applyOverviewFilter(key) {
          if (key === 'pending_review') {
            this.activeKpi = key;
            this.openInbox('pending_review');
            return;
          }
          if (this.activeKpi === key) {
            this.resetFilters();
            return;
          }
          this.activeKpi = key;
          this.search = '';
          this.filters = this.emptyFilters();
          if (this.view === 'inbox') this.openAgencies();

          if (key === 'total') {
            // no filters — show all
          } else if (key === 'priority' || key === 'review' || key === 'low') {
            this.filters.tier = key;
          } else if (key === 'never') {
            this.filters.outreachStatus = 'never';
          } else if (
            key === 'drafted'
            || key === 'sent'
            || key === 'needs_rewrite'
            || key === 'failed'
            || key === 'approved'
            || key === 'rejected'
          ) {
            this.filters.outreachStatus = key;
          } else if (key === 'drafted_7d') {
            this.filters.outreachStatus = 'drafted';
            this.filters.draftedWithinDays = 7;
          } else if (key === 'eligible') {
            this.filters.eligibleOnly = 'true';
          }
        },

        fmtAvg(v) {
          if (v == null || v === '') return '—';
          return Number(v).toFixed(1);
        },

        tierBadgeClass(tier) {
          if (tier === 'priority') return 'badge-priority';
          if (tier === 'review') return 'badge-review';
          if (tier === 'low') return 'badge-low';
          return 'badge-none';
        },

        outreachBadgeClass(status) {
          if (!status) return 'badge-none';
          const map = {
            drafted: 'badge-drafted',
            sent: 'badge-sent',
            ready: 'badge-ready',
            pending_rating: 'badge-pending_rating',
            pending_review: 'badge-pending_review',
            approved: 'badge-approved',
            rejected: 'badge-rejected',
            needs_rewrite: 'badge-needs_rewrite',
            failed: 'badge-failed',
          };
          return map[status] || 'badge-none';
        },

        setSort(key) {
          if (this.sortKey === key) {
            this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            this.sortKey = key;
            this.sortDir = key === 'agency_name' || key === 'city' || key === 'tier' || key === 'outreach_status' ? 'asc' : 'desc';
          }
        },

        formatDate(v) {
          if (!v) return '—';
          try {
            return new Date(v).toLocaleString();
          } catch (e) {
            return String(v);
          }
        },

        formatRawScore(raw) {
          if (raw == null || raw === '') return '—';
          try {
            const obj = typeof raw === 'string' ? JSON.parse(raw) : raw;
            return JSON.stringify(obj, null, 2);
          } catch (e) {
            return String(raw);
          }
        },

        normalizeRow(r) {
          return {
            ...r,
            reasons: typeof r.reasons === 'string' ? (() => { try { return JSON.parse(r.reasons); } catch { return r.reasons; } })() : r.reasons,
            red_flags: typeof r.red_flags === 'string' ? (() => { try { return JSON.parse(r.red_flags); } catch { return r.red_flags; } })() : r.red_flags,
            raw_score: typeof r.raw_score === 'string' ? (() => { try { return JSON.parse(r.raw_score); } catch { return r.raw_score; } })() : r.raw_score,
          };
        },

        draftFrom(row) {
          return {
            fit_score: Number(row.fit_score) || 0,
            white_label_score: Number(row.white_label_score) || 0,
            ops_automation_score: Number(row.ops_automation_score) || 0,
            tier: row.tier || 'low',
            synopsis: row.synopsis || '',
            is_real_agency: !!row.is_real_agency,
            white_label_fit: !!row.white_label_fit,
            ops_fit: !!row.ops_fit,
          };
        },

        isDirty(row) {
          const d = this.drafts[row.agency_id];
          if (!d) return false;
          const o = this.draftFrom(row);
          return (
            Number(d.fit_score) !== o.fit_score ||
            Number(d.white_label_score) !== o.white_label_score ||
            Number(d.ops_automation_score) !== o.ops_automation_score ||
            d.tier !== o.tier ||
            (d.synopsis || '') !== o.synopsis ||
            !!d.is_real_agency !== o.is_real_agency ||
            !!d.white_label_fit !== o.white_label_fit ||
            !!d.ops_fit !== o.ops_fit
          );
        },

        apiUrl(kind, id) {
          const mapped = {
            list: '/api/agencies',
            overview: '/api/overview',
            update: '/api/agencies/update',
            review: '/api/outreach/review',
            detail: '/api/agencies/' + id,
          };
          const url = new URL(mapped[kind] || kind, window.location.origin);
          url.searchParams.set('token', this.token);
          return url.toString();
        },

        async refreshAll() {
          await Promise.all([this.loadOverview(), this.loadAgencies()]);
        },

        async loadOverview() {
          this.overviewLoading = true;
          try {
            const res = await fetch(this.apiUrl('overview'), {
              headers: { Authorization: 'Bearer ' + this.token },
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || ('HTTP ' + res.status));
            }
            this.overview = await res.json();
          } catch (e) {
            console.error('overview load failed', e);
            // Keep list usable even if overview fails
          } finally {
            this.overviewLoading = false;
          }
        },

        async loadAgencies() {
          this.loading = true;
          this.error = '';
          try {
            const res = await fetch(this.apiUrl('list'), {
              headers: { Authorization: 'Bearer ' + this.token },
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || ('HTTP ' + res.status));
            }
            const data = await res.json();
            const rows = Array.isArray(data) ? data : (data.agencies || data.data || []);
            this.agencies = rows.map((r) => this.normalizeRow(r));
            const next = {};
            for (const row of this.agencies) next[row.agency_id] = this.draftFrom(row);
            this.drafts = next;
          } catch (e) {
            this.error = e.message || String(e);
          } finally {
            this.loading = false;
          }
        },

        async openDetail(agencyId, pushHash = true) {
          const id = Number(agencyId);
          if (!Number.isFinite(id) || id <= 0) return;
          this.view = 'detail';
          this.selectedId = id;
          this.detailLoading = true;
          this.error = '';
          this.showRaw = false;
          this.reviewNote = '';
          this.reviewing = null;
          if (pushHash) {
            const next = '#/agency/' + id;
            if (window.location.hash !== next) window.location.hash = next;
          }
          try {
            const res = await fetch(this.apiUrl('detail', id), {
              headers: { Authorization: 'Bearer ' + this.token },
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || ('HTTP ' + res.status));
            }
            const row = this.normalizeRow(await res.json());
            this.detail = row;
            this.drafts[row.agency_id] = this.draftFrom(row);
          } catch (e) {
            this.error = e.message || String(e);
            this.detail = null;
          } finally {
            this.detailLoading = false;
          }
        },

        closeDetail(clearHash = true) {
          this.view = 'list';
          this.selectedId = null;
          this.detail = null;
          this.detailLoading = false;
          this.showRaw = false;
          this.reviewNote = '';
          this.reviewing = null;
          if (clearHash && window.location.hash) {
            history.pushState('', document.title, window.location.pathname + window.location.search);
          }
        },

        async reviewOutreach(action) {
          if (!this.detail || this.detail.outreach_status !== 'pending_review') return;
          this.reviewing = action;
          this.error = '';
          try {
            const res = await fetch(this.apiUrl('review'), {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + this.token,
              },
              body: JSON.stringify({
                agency_id: this.detail.agency_id,
                action,
                note: this.reviewNote || null,
              }),
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || ('HTTP ' + res.status));
            }
            const updated = await res.json();
            const patch = {
              outreach_status: updated.outreach_status,
              outreach_subject: updated.outreach_subject,
              outreach_body: updated.outreach_body,
              outreach_snippet: updated.outreach_snippet
                || (updated.outreach_body ? String(updated.outreach_body).slice(0, 140) : null),
              outreach_error: updated.outreach_error,
              overall_score: updated.overall_score,
              accuracy_score: updated.accuracy_score,
              quality_score: updated.quality_score,
              gmail_draft_id: updated.gmail_draft_id,
              drafted_at: updated.drafted_at,
              outreach_updated_at: updated.outreach_updated_at,
            };
            this.detail = { ...this.detail, ...patch };
            const idx = this.agencies.findIndex((a) => a.agency_id === this.detail.agency_id);
            if (idx >= 0) {
              this.agencies[idx] = { ...this.agencies[idx], ...patch };
            }
            this.reviewNote = '';
            this.loadOverview();
          } catch (e) {
            this.error = e.message || String(e);
          } finally {
            this.reviewing = null;
          }
        },

        async saveRow(row) {
          const d = this.drafts[row.agency_id];
          if (!d) return;
          this.savingId = row.agency_id;
          this.savedId = null;
          this.error = '';
          try {
            const res = await fetch(this.apiUrl('update'), {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + this.token,
              },
              body: JSON.stringify({
                agency_id: row.agency_id,
                fit_score: Number(d.fit_score),
                white_label_score: Number(d.white_label_score),
                ops_automation_score: Number(d.ops_automation_score),
                tier: d.tier,
                synopsis: d.synopsis,
                is_real_agency: !!d.is_real_agency,
                white_label_fit: !!d.white_label_fit,
                ops_fit: !!d.ops_fit,
              }),
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || ('HTTP ' + res.status));
            }
            const updated = await res.json();
            const payload = Array.isArray(updated) ? updated[0] : updated;
            const patch = {
              fit_score: payload.fit_score ?? d.fit_score,
              white_label_score: payload.white_label_score ?? d.white_label_score,
              ops_automation_score: payload.ops_automation_score ?? d.ops_automation_score,
              tier: payload.tier ?? d.tier,
              synopsis: payload.synopsis ?? d.synopsis,
              is_real_agency: payload.is_real_agency ?? d.is_real_agency,
              white_label_fit: payload.white_label_fit ?? d.white_label_fit,
              ops_fit: payload.ops_fit ?? d.ops_fit,
              updated_at: payload.updated_at || new Date().toISOString(),
            };

            const idx = this.agencies.findIndex((a) => a.agency_id === row.agency_id);
            if (idx >= 0) {
              this.agencies[idx] = { ...this.agencies[idx], ...patch };
              this.drafts[row.agency_id] = this.draftFrom(this.agencies[idx]);
            }
            if (this.detail && this.detail.agency_id === row.agency_id) {
              this.detail = { ...this.detail, ...patch };
              this.drafts[row.agency_id] = this.draftFrom(this.detail);
            }
            this.savedId = row.agency_id;
            setTimeout(() => { if (this.savedId === row.agency_id) this.savedId = null; }, 2000);
            this.loadOverview();
          } catch (e) {
            this.error = e.message || String(e);
          } finally {
            this.savingId = null;
          }
        },
      };
    }
  </script>
