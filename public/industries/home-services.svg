<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hs-bg" x1="0" y1="0" x2="800" y2="600">
      <stop stop-color="#D8F2F4"/>
      <stop offset=".5" stop-color="#EDF8F5"/>
      <stop offset="1" stop-color="#CCEBE5"/>
    </linearGradient>
    <linearGradient id="hs-card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7FFFE"/>
      <stop offset="1" stop-color="#D7F0EC"/>
    </linearGradient>
    <linearGradient id="hs-house" x1="340" y1="180" x2="460" y2="420">
      <stop stop-color="#6FB8B0"/>
      <stop offset="1" stop-color="#057A72"/>
    </linearGradient>
    <linearGradient id="hs-metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F7FFFE"/>
      <stop offset="1" stop-color="#A8D9D2"/>
    </linearGradient>
    <radialGradient id="hs-glow" cx="50%" cy="42%" r="48%">
      <stop stop-color="#FFFDF4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#B0E4DC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#hs-bg)"/>
  <circle cx="400" cy="300" r="220" fill="url(#hs-glow)"/>
  <path d="M0 535c200-36 380-24 560 6 120 20 170 12 240-14v73H0V535Z" fill="#EAF7F4" opacity=".85"/>

  <!-- Outer orbit ring -->
  <circle cx="400" cy="300" r="210" stroke="#6FB8B0" stroke-width="1.5" opacity=".45"/>
  <circle cx="400" cy="300" r="210" stroke="#057A72" stroke-width="1" stroke-dasharray="6 10" opacity=".28"/>

  <!-- Center house -->
  <g>
    <circle cx="400" cy="300" r="88" fill="url(#hs-house)"/>
    <circle cx="400" cy="300" r="88" fill="#FFFDF4" opacity=".12"/>
    <circle cx="400" cy="300" r="108" stroke="#6FB8B0" stroke-width="1.25" opacity=".4"/>
    <!-- House shape -->
    <path
      d="M400 232 L460 288 V368 H340 V288 Z"
      fill="none"
      stroke="#F7FFFE"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <rect x="386" y="328" width="28" height="40" fill="none" stroke="#F7FFFE" stroke-width="3" rx="2"/>
  </g>

  <!-- Paintbrush — top -->
  <g transform="translate(400 90)">
    <circle cx="0" cy="0" r="52" fill="url(#hs-card)" stroke="#057A72" stroke-width="2"/>
    <g transform="rotate(-35)">
      <rect x="-7" y="2" width="14" height="34" rx="6" fill="#057A72"/>
      <rect x="-12" y="-8" width="24" height="14" rx="2" fill="#6FB8B0" stroke="#057A72" stroke-width="1.5"/>
      <path d="M-11 -8 L-12 -28 Q0 -36 12 -28 L11 -8 Z" fill="url(#hs-metal)" stroke="#057A72" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M-5 -8 V-26M0 -8 V-30M5 -8 V-26" stroke="#057A72" stroke-width="1.25" opacity=".4"/>
      <ellipse cx="0" cy="-30" rx="10" ry="5" fill="#057A72"/>
    </g>
  </g>

  <!-- Pipe — right -->
  <g transform="translate(610 300)">
    <circle cx="0" cy="0" r="52" fill="url(#hs-card)" stroke="#057A72" stroke-width="2"/>
    <!-- Elbow pipe -->
    <path d="M-8 -22 V4 C-8 18 2 24 16 24 H28" stroke="#057A72" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M-8 -22 V4 C-8 18 2 24 16 24 H28" stroke="url(#hs-metal)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <rect x="-16" y="-18" width="16" height="8" rx="2" fill="#057A72" opacity=".5"/>
    <!-- Valve -->
    <circle cx="28" cy="24" r="12" fill="url(#hs-card)" stroke="#057A72" stroke-width="1.75"/>
    <circle cx="28" cy="24" r="3.5" fill="#057A72"/>
    <path d="M28 15v18M19 24h18" stroke="#057A72" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wrench — bottom -->
  <g transform="translate(400 510)">
    <circle cx="0" cy="0" r="52" fill="url(#hs-card)" stroke="#057A72" stroke-width="2"/>
    <g transform="rotate(-20)">
      <!-- Open jaw -->
      <path
        d="M-30 -12 H-18 V-6 H-26 C-30 -6 -32 -3 -32 0 C-32 3 -30 6 -26 6 H-18 V12 H-30
           C-38 12 -44 6 -44 0 C-44 -6 -38 -12 -30 -12 Z"
        fill="url(#hs-metal)"
        stroke="#057A72"
        stroke-width="1.75"
        stroke-linejoin="round"
      />
      <!-- Shaft -->
      <rect x="-20" y="-6" width="42" height="12" rx="4" fill="url(#hs-metal)" stroke="#057A72" stroke-width="1.75"/>
      <!-- Hex ring -->
      <circle cx="30" cy="0" r="14" fill="url(#hs-metal)" stroke="#057A72" stroke-width="1.75"/>
      <path d="M30 -7 L36 -3.5 L36 3.5 L30 7 L24 3.5 L24 -3.5 Z" fill="#EDF8F5" stroke="#057A72" stroke-width="1.25" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Lawn mower — left -->
  <g transform="translate(190 300)">
    <circle cx="0" cy="0" r="52" fill="url(#hs-card)" stroke="#057A72" stroke-width="2"/>
    <!-- Deck -->
    <rect x="-22" y="0" width="44" height="16" rx="6" fill="url(#hs-metal)" stroke="#057A72" stroke-width="1.75"/>
    <!-- Wheels -->
    <circle cx="-14" cy="16" r="9" fill="url(#hs-card)" stroke="#057A72" stroke-width="1.75"/>
    <circle cx="-14" cy="16" r="3" fill="#057A72"/>
    <circle cx="14" cy="16" r="9" fill="url(#hs-card)" stroke="#057A72" stroke-width="1.75"/>
    <circle cx="14" cy="16" r="3" fill="#057A72"/>
    <!-- Handle -->
    <path d="M8 2 L18 -22 H-4" stroke="#057A72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-4 -22 H8" stroke="#057A72" stroke-width="3" stroke-linecap="round"/>
    <!-- Engine bump -->
    <rect x="-6" y="-8" width="16" height="10" rx="3" fill="#057A72" opacity=".55"/>
  </g>

  <!-- Soft spokes toward orbit nodes -->
  <g stroke="#057A72" stroke-width="1.25" stroke-dasharray="4 8" opacity=".28">
    <path d="M400 212 V162"/>
    <path d="M488 300 H558"/>
    <path d="M400 388 V458"/>
    <path d="M312 300 H242"/>
  </g>
</svg>
